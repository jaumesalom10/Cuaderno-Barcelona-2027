<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BCN 2027">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cuaderno Barcelona 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de app (máx. 760px) con cabecera fija tipo dorsal, pestañas y hoja inferior para registrar */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E4E9EE; --ink:#122033; --muted:#5A697A; --line:#D3DAE2;
  --accent:#2546C9; --accent-ink:#FFFFFF; --accent-soft:#DDE4FB;
  --tE:#0E8577; --tT:#B06C08; --tM:#2546C9; --tH:#7B3DBF; --tR:#C8352B; --tG:#4A5A70;
  --ok:#1D8A4C; --warn:#A86A12; --crit:#C53030;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1218; --surface:#141C25; --sunk:#0F171F; --ink:#E4EAF1; --muted:#8B9BAE; --line:#243142;
    --accent:#7F95FF; --accent-ink:#0C1218; --accent-soft:#1F2A4E;
    --tE:#3EC1B1; --tT:#E2A33E; --tM:#7F95FF; --tH:#B387F2; --tR:#FF6A5C; --tG:#9AA9BB;
    --ok:#4CC27E; --warn:#E3AE4F; --crit:#FF6B6B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1218; --surface:#141C25; --sunk:#0F171F; --ink:#E4EAF1; --muted:#8B9BAE; --line:#243142;
  --accent:#7F95FF; --accent-ink:#0C1218; --accent-soft:#1F2A4E;
  --tE:#3EC1B1; --tT:#E2A33E; --tM:#7F95FF; --tH:#B387F2; --tR:#FF6A5C; --tG:#9AA9BB;
  --ok:#4CC27E; --warn:#E3AE4F; --crit:#FF6B6B; color-scheme:dark;
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand h1 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:none;margin-top:4px}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="db"] i{background:var(--ok)} .sync[data-s="local"] i{background:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 10px 10px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:18px 56px}
section.view{display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* Dorsal */
.bib{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:end}
.bib::before,.bib::after,.bib .h1,.bib .h2{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.bib::before{top:9px;left:9px}.bib::after{top:9px;right:9px}.bib .h1{bottom:9px;left:9px}.bib .h2{bottom:9px;right:9px}
.bib .num{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.85;letter-spacing:-.01em}
.bib .num span{font-size:26px;color:var(--muted);margin-right:2px}
.bib .meta{display:flex;flex-direction:column;gap:2px;padding-bottom:4px;min-width:0}
.bib .meta b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.bib .phase{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* Chips de tipo */
.chip{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.t-E{--c:var(--tE)}.t-T{--c:var(--tT)}.t-M{--c:var(--tM)}.t-H{--c:var(--tH)}.t-R{--c:var(--tR)}.t-G{--c:var(--tG)}

/* Sesión destacada */
.session{display:flex;flex-direction:column;gap:12px}
.session .head{display:flex;gap:12px;align-items:flex-start}
.session .head .t{flex:1;min-width:0}
.session .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.session .title{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;text-transform:uppercase;margin-top:4px;text-wrap:balance}
.big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1}
.big small{font-size:18px;color:var(--muted);font-weight:600;margin-left:4px}
.spec{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
.spec dt{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.spec dd{margin:0;min-width:0}
.target{border-left:3px solid var(--c,var(--accent));padding:8px 12px;background:var(--sunk);border-radius:0 8px 8px 0;font-weight:500}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:default}

/* Tira semanal */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;text-align:center}
.day .dn{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase}
.day .dd{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1}
.day.is-today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.st-success .dot,.dot.st-success{background:var(--ok)}
.st-adapted .dot,.dot.st-adapted{background:var(--warn)}
.st-missed .dot,.dot.st-missed{background:var(--crit)}
.st-unlogged .dot,.dot.st-unlogged{background:transparent;border:1.5px dashed var(--warn)}
.st-today .dot,.dot.st-today{background:var(--accent)}

/* Barras */
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.kpi .l{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* Avisos */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 0;overflow:hidden}
.alert::before{content:"";background:var(--c);border-radius:0 3px 3px 0}
.alert b{display:block;font-weight:600}
.alert p{margin:2px 0 0;color:var(--muted);font-size:14px}
.a-crit{--c:var(--crit)}.a-warn{--c:var(--warn)}.a-info{--c:var(--accent)}.a-ok{--c:var(--ok)}

/* Lista de la semana */
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .btn{padding:6px 12px;font-size:18px;line-height:1}
.weeknav .w{flex:1;min-width:0}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:52px 34px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.item .date{display:flex;flex-direction:column;line-height:1.1}
.item .date b{font-family:var(--f-display);font-size:20px;font-weight:700}
.item .date span{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase}
.item .txt{min-width:0}
.item .txt b{display:block;font-weight:600}
.item .txt span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.today{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.stl{font-family:var(--f-mono);font-size:11px;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)}
.rest{padding:10px 14px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--sunk)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.cur td{background:color-mix(in srgb,var(--accent) 7%,transparent)}

/* Gráficos */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.grp{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.grp .bar{height:10px}
.grp .bar i{background:var(--c,var(--accent))}
.grp .bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}

/* Hoja de registro */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:color-mix(in srgb,#000 45%,transparent)}
.sheet[hidden]{display:none!important}
.panel{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:14px;max-height:88vh}}
.panel .close{position:sticky;top:-18px;margin:-18px 0 0;padding-top:18px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;z-index:2}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:0;margin-bottom:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:9px 6px;font-weight:600;font-size:14px;cursor:pointer;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{color:var(--c)}
.seg label:has(input:checked){background:color-mix(in srgb,var(--c) 13%,transparent)}
.seg .r-success{--c:var(--ok)}.seg .r-adapted{--c:var(--warn)}.seg .r-missed{--c:var(--crit)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.ex .nm{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .nm b{font-weight:600}
.ex .rx{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.ex .last{font-size:13px;color:var(--muted)}
.ex .sug{font-size:13px;font-weight:600}
.ex .sug.up{color:var(--ok)} .ex .sug.hold{color:var(--muted)}
.ex .in{display:grid;grid-template-columns:1fr 1.4fr .8fr auto;gap:8px;align-items:end}
.ex .in label.f input{padding:7px 8px}
.ex .chk{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:9px}
.ex .note{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--crit);border-radius:8px;padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.mcard .ml{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase}
.mcard .mv{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1}
.mcard .mv small{font-size:13px;color:var(--muted);margin-left:3px}
.mcard .md{font-family:var(--f-mono);font-size:11px;color:var(--muted)} .mcard .md.good{color:var(--ok)} .mcard .md.bad{color:var(--crit)}
.mcard svg{margin-top:4px;max-height:56px}
.pr{margin-left:8px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:99px;background:var(--ok);color:#fff;vertical-align:2px}
ul.read{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:var(--r);background:var(--surface)}
.steps .at{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.steps .am{color:var(--muted)} .steps .pc{font-weight:600;color:var(--c,var(--accent));font-size:14px;margin-top:2px}
.steps .nt{font-size:13.5px;color:var(--muted);margin-top:3px}
.steps li.t-E{--c:var(--tE)}.steps li.t-T{--c:var(--tT)}.steps li.t-M{--c:var(--tM)}.steps li.t-H{--c:var(--tH)}.steps li.t-R{--c:var(--tR)}.steps li.t-W{--c:var(--tG)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
@media (max-width:460px){
  .bib .num{font-size:52px}
  .item{grid-template-columns:44px 30px 1fr auto;gap:8px;padding:11px 12px}
  .ex .in{grid-template-columns:1fr 1fr .8fr}
  .ex .chk{grid-column:1 / -1;padding-bottom:0}
  .grp{grid-template-columns:90px 1fr 48px}
  .kpi .v{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px)}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Cuaderno Barcelona 2027<small>3 carreras · 3 gimnasios · domingo tirada</small></h1>
      <span class="sync" id="sync" data-s="loading"><i></i><span>Conectando…</span></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" data-tab="hoy" id="tab-hoy">Hoy</button>
      <button role="tab" data-tab="semana" id="tab-semana">Semana</button>
      <button role="tab" data-tab="plan" id="tab-plan">Plan</button>
      <button role="tab" data-tab="progreso" id="tab-progreso">Progreso</button>
      <button role="tab" data-tab="resumen" id="tab-resumen">Resumen</button>
      <button role="tab" data-tab="ajustes" id="tab-ajustes">Ajustes</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="vendor/supabase-2.45.4.js"></script>
<script>
/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);

function item(lib, entry, over = {}) {
  const [name, setsOver] = Array.isArray(entry) ? entry : [entry];
  const v = lib[name];
  return Object.assign({name, group:v[0], sets: setsOver ?? v[1], reps:v[2], rest:v[3], rir:v[4], alt:v[5], note:v[6]}, over);
}
function gymNote(w) {
  if (w === 1) return '2 series por ejercicio, RIR 3–4. Técnica y cargas cómodas.';
  if (w <= 3) return 'Básicos 3 × 6–8 y accesorios 2 × 8–15. RIR 2–3 en torso y 3–4 en pierna.';
  if (w === 4) return 'Descarga: 1–2 series, RIR 4.';
  if (BASE_W.includes(w)) return 'Tabla completa con doble progresión: sube carga cuando completas el rango con el RIR indicado. Sentadilla y rumano bajan de 6–8 a 4–6 repeticiones entre noviembre y diciembre.';
  if (w === 8) return 'Semana de Bombers: el miércoles solo sentadilla 2 × 5 a RIR 4 y torso; el viernes solo torso.';
  if (DELOAD_W.includes(w)) return 'Descarga: una serie menos por ejercicio, RIR 4 y sin subir pesos.';
  if (SPEC_W.includes(w)) return 'Torso con la tabla completa. Pierna con la misma carga y menos series. Sin ejercicios nuevos.' + ([21,23].includes(w) ? ' El viernes, una serie menos de pierna porque el domingo hay ritmo M.' : '');
  if (w === 24) return 'Torso completo. Pierna a 2 series, RIR 3, sin pogos.';
  if (w === 25) return 'Última sesión pesada de pierna el miércoles 3 de marzo. El viernes, solo torso.';
  return 'Semana de carrera: lunes torso ligero; miércoles y viernes, movilidad sin cargas.';
}
function gymSession(w, code) {
  let lib = LIB_NEW, list, dose, title = SESSION_TITLE[code];
  if (w <= 4) {
    lib = LIB_OLD; title = {A:'Torso', B:'Pierna', C:'Mixto'}[code];
    dose = w === 4 ? 'Ligera' : 'Adaptación';
    if (w === 4 && code === 'A') { dose = 'En casa'; list = HOME_A.map(n => item(LIB_OLD, n)); }
    else {
      const base = code === 'A' ? OLD_A : code === 'B' ? OLD_B : OLD_C;
      list = base.map(e => { const it = item(LIB_OLD, e); if (w === 1) { it.sets = it.name.includes('+') ? 4 : 2; it.rir = '3-4'; } if (w === 4) { it.sets = Math.max(1, it.sets - 1); it.rir = '4'; } return it; });
    }
  } else if (w === 26) {
    dose = 'Carrera';
    if (code === 'A') list = ['Press banca','Remo con pecho apoyado','Jalón al pecho','Elevación lateral','Curl bíceps','Extensión de tríceps'].map(n => item(LIB_NEW, n, {sets:1, rir:'4'}));
    else { lib = LIB_MOB; title = 'Movilidad'; list = MOB.map(n => item(LIB_MOB, n)); }
  } else {
    const base = code === 'A' ? NEW_A : code === 'B' ? NEW_B : NEW_C;
    list = base.map(e => item(LIB_NEW, e));
    if (BASE_W.includes(w)) dose = 'Base';
    else if (DELOAD_W.includes(w)) { dose = 'Descarga'; list.forEach(it => { it.sets = Math.max(1, it.sets - 1); it.rir = '4'; if (it.name.startsWith('Pogos')) it.sets = 2; }); }
    else if (SPEC_W.includes(w)) {
      dose = 'Específica';
      list.forEach(it => { if (SPEC_LEG[it.name]) { it.sets = SPEC_LEG[it.name]; if (it.name.startsWith('Sentadilla con')) it.reps = '4-5'; if (code === 'C' && [21,23].includes(w)) it.sets = Math.max(1, it.sets - 1); } });
    } else if (w === 8) {
      dose = 'Bombers';
      if (code === 'B') list = list.filter(it => !LEG.has(it.name) || it.name.startsWith('Sentadilla con')).map(it => it.name.startsWith('Sentadilla con') ? Object.assign(it, {sets:2, reps:'5', rir:'4'}) : it);
      if (code === 'C') list = list.filter(it => !LEG.has(it.name));
    } else if (w === 24) {
      dose = 'Reducción';
      list = list.filter(it => !it.name.startsWith('Pogos')).map(it => LEG.has(it.name) ? Object.assign(it, {sets:2, rir:'3'}) : it);
    } else if (w === 25) {
      dose = 'Reducción';
      if (code === 'A') list.forEach(it => it.sets = Math.max(1, it.sets - 1));
      if (code === 'B') list = list.filter(it => !['Pogos (saltitos de tobillo)','Peso muerto rumano'].includes(it.name)).map(it => {
        if (it.name.startsWith('Sentadilla con')) return Object.assign(it, {sets:2, reps:'3', rir:'3'});
        if (it.name === 'Elevación de gemelo de pie') return Object.assign(it, {sets:2});
        return Object.assign(it, {sets: Math.max(1, it.sets - 1)});
      });
      if (code === 'C') list = list.filter(it => !LEG.has(it.name)).map(it => Object.assign(it, {sets: Math.max(1, it.sets - 1)}));
    }
  }
  const sets = list.reduce((a, it) => a + (+it.sets || 1), 0);
  return {type:'G', code, title, dose, items:list, estMin: Math.max(15, r5(sets * 2.2 + 5)), note: gymNote(w)};
}

/* ---------- Guion paso a paso de las sesiones de carrera ---------- */
function runSteps(s, pc) {
  const mid = r => (r[0] + r[1]) / 2, mE = mid(pc.E);

  const tMid = pc.T ? mid(pc.T) : mE - 80, mMid = pc.M ? mid(pc.M) : mE - 40;
  const tR = pc.T ? `T ${fPace(pc.T[0])}–${fPace(pc.T[1])}/km · RPE 6–7` : 'RPE 6–7 (frases cortas), sin reloj fijo todavía';

  const r5k = k => Math.max(0, Math.round(k * 2) / 2);
  const kmMin = k => k * mE / 60;
  const st = []; let cum = 0;
  const add = (k, title, dur, amount, pace, note) => { st.push({k, title, from: Math.round(cum), to: Math.round(cum + dur), amount, pace, note: note || ''}); cum += dur; };

  const main = s.main || '', t = s.title || '';

    const rw = main.match(/(\d+)\s*×\s*\((\d+)′ correr \+ (\d+)′ andar\)/), cont = main.match(/(\d+)′ de carrera fácil continua/), walkEnd = /y 10′ andando/.test(main);
    add('W', 'Antes de empezar', 4, '3–5′ andando', 'paso vivo', 'Movilidad de tobillo y cadera (1–2′). Empieza con las piernas calientes.');
    if (rw) { const n = +rw[1], a = +rw[2], b = +rw[3]; add('E', `${n} × (${a}′ corriendo + ${b}′ andando)`, n * (a + b), `${n * a}′ corriendo · ${n * b}′ andando`, 'ritmo libre, RPE 2 · ve más lento que ' + eR, `Pon el cronómetro por intervalos: ${a}′ / ${b}′ × ${n}. Al andar, paso rápido, sin parar del todo. Si el tobillo duele, acorta el tramo de correr.`); }
    if (cont) add('E', `${cont[1]}′ de carrera continua`, +cont[1], `${cont[1]}′ seguidos`, 'ritmo libre, RPE 2 · mejor lento que rápido', 'Si te falta el aire para hablar, camina 1′ y vuelve a empezar. Anota cuánto de verdad corriste.');
    if (walkEnd) add('W', 'Vuelta a la calma', 10, '10′ andando', 'paso tranquilo', 'No pares en seco. Termina con 2–3′ de estiramiento suave de gemelo.');
    return st;
  }
  // Carreras con pauta propia
  if (t.startsWith('Marató')) {
    add('E', 'Calentamiento', 12, '2 km muy suaves + 2–3 progresivos de 15″', eR, 'Sin forzar; guarda piernas.');
    add('E', 'Km 1–5', kmMin(5) * 0.97, '5 km', `5–10 s/km más lento que M (${fPace(mMid + 5)}–${fPace(mMid + 10)}/km)`, 'Se te hará lento. Es a propósito.');
    add('M', 'Km 5–30', 25 * mMid / 60, '25 km', mR, 'Constante. Bebe y toma gel según tu plan ya validado.');
    add('H', 'Km 30–42,2', 12.2 * mMid / 60, '12,2 km', 'decides tú por sensaciones', 'Si vas bien, aprieta poco a poco. Si no, mantén M y llega.');
    return st;
  }
  if (t.startsWith('Cursa Bombers')) {
    add('E', 'Calentamiento', kmMin(2), '2 km E + 3 progresivos de 15″', eR, 'Termina 10–15′ antes de la salida.');
    add('T', 'Km 1–3', 3 * (mE - 60) / 60, '3 km', 'RPE 6', 'Salida controlada: es donde todos se pasan.');
    add('T', 'Km 4–8', 5 * (mE - 80) / 60, '5 km', 'RPE 7', 'Respiración fuerte pero sostenida.');
    add('R', 'Km 9–10', 2 * (mE - 100) / 60, '2 km', 'RPE 8–9 solo si vas estable', 'Si dudas, mantén RPE 7. Anota el tiempo oficial.');
    return st;
  }
  if (t.startsWith('San Silvestre')) { E_('Todo el recorrido', 8, 'Con gente, hablando. No compitas; es un rodaje con ambiente.'); return st; }
  if (t.startsWith('Control fácil')) {
    E_('Primeros 10′', 1.4, 'Entra en calor al ritmo E, a tu ritmo.');
    add('E', '20′ centrales (control)', 20, `${num(20 * 60 / mE)} km aprox.`, `${eR} · constante`, 'Recorrido llano conocido. Anota ritmo medio y FC de estos 20′ para compararlo con la semana 12.');
    E_('Resto', s.km - 1.4 - 20 * 60 / mE, 'Vuelta a la calma, mismo ritmo o un poco más lento.');
    return st;
  }
  if (t.startsWith('Activación')) {
    E_('Rodaje E', 3, 'Desde el principio, a ritmo cómodo.');
    add('H', '3 × 15″ progresivos', 3, 'repartidos en el último km', 'RPE 5, sin sprint', 'Acelera suave 15″ y vuelve a E con 1′ de trote entre ellos.');
    return st;
  }
  const km = s.km || 0;
  const warmKm = s.type === 'M' ? 3 : 2, warmNote = {T:'Antes, 3–5′ de movilidad dinámica. Termina el calentamiento con 3 × 15″ progresivos suaves.', M:'Antes, 3–5′ de movilidad dinámica.', H:'Antes, 3–5′ de movilidad dinámica. Acaba con 3 progresivos de 15–20″ (RPE 5).'}[s.type] || '';

  const mb = main.match(/(\d+)\s*×\s*(\d+)′\s*a\s*(T|M|RPE 6)\s*con\s*(\d+)′\s*E/);
  if (mb && !/^30′ E/.test(main)) {
    const n = +mb[1], d = +mb[2], rec = +mb[4], kind = mb[3], pS = kind === 'T' ? tMid : kind === 'M' ? mMid : mE - 60;
    const blockKm = n * d * 60 / pS + (n - 1) * rec * 60 / mE, cool = r5k(km - warmKm - blockKm);
    E_('Calentamiento', warmKm, warmNote);
    add(kind === 'RPE 6' ? 'H' : kind, `${n} bloques de ${d}′`, n * d + (n - 1) * rec, `${n} × ${d}′ con ${rec}′ de trote E entre ellos`, kind === 'T' ? tR : kind === 'M' ? mR : 'RPE 6 · vivo pero controlado, sin sprint', `Empieza al acabar el calentamiento (hacia el km ${num(warmKm)}). Cada bloque: ${d}′ a ritmo; los ${rec}′ de entre bloques, trote muy suave. El último bloque no debe ir más rápido que el primero.`);
    if (cool > 0) E_('Vuelta a la calma', cool, 'Último km muy suave.');
    return st;
  }
  // Cuestas cortas
  const hm = main.match(/(\d+)\s*×\s*(\d+)″\s*en cuesta/);
  if (hm) {
    const n = +hm[1], d = +hm[2], blockMin = n * (d + 90) / 60, cool = r5k(km - warmKm - blockMin * 60 / mE);
    E_('Calentamiento', warmKm, warmNote);
    add('H', `${n} cuestas de ${d}″`, blockMin, `${n} × ${d}″ en cuesta (4–6 %, 100–150 m)`, 'RPE 7 · rápido y con técnica, nunca sprint', `Sube con zancada corta y brazos activos. Baja ANDANDO hasta recuperar del todo (≈1′30″) antes de la siguiente. Empieza al acabar el calentamiento, en la cuesta.`);
    if (cool > 0) E_('Vuelta a la calma', cool, 'Rodaje E hasta completar los km.');
    return st;
  }
  // Tirada con bloques M (S21)
  const tb = main.match(/^(\d+)′ E, después (\d+) × (\d+)′ a M con (\d+)′ E/);
  if (tb) {
    const first = +tb[1], n = +tb[2], d = +tb[3], rec = +tb[4], mk = n * d * 60 / mMid + (n - 1) * rec * 60 / mE, rest = r5k(km - first * 60 / mE - mk - 2);
    add('E', 'Inicio fácil', first, `${first}′ E`, `${eR} · RPE 2–3`, 'Sin prisa. Bebe a sorbos desde el primer cuarto de hora.');
    add('M', `${n} bloques de ${d}′ a ritmo M`, n * d + (n - 1) * rec, `${n} × ${d}′ con ${rec}′ E entre ellos`, mR, 'Es el ensayo del día de carrera: mismo calzado, mismo gel, mismo ritmo de toma.');
    if (rest > 0) E_('Rodaje E hasta los últimos 2 km', rest, 'Reparte los km que faltan a ritmo E.');
    E_('Últimos 2 km', 2, 'Muy suaves. Termina andando 5′.');
    return st;
  }
  // Tirada con M continuo (S22)
  if (/seguidos a M en la parte central/.test(main)) {
    const mm = 52, mk = mm * 60 / mMid, side = r5k((km - mk) / 2);
    E_('Inicio fácil', side, 'Entra en calor con calma.');
    add('M', '45–60′ seguidos a M', mm, `≈ ${num(mk)} km`, mR, 'Sin pausas. Ritmo estable; si pasas de 60′, para.');
    E_('Vuelta fácil', km - side - mk, 'Rodaje E hasta completar.');
    return st;
  }
  // Tirada larga de 27 km y tiradas largas en general
  if (s.dow === 6 && km >= 15) {
    add('E', 'Primeros 3 km', kmMin(3) * 1.04, '3 km', `extremo lento de ${eR}`, 'Empieza más lento de lo que te apetece. Aquí se gana la tirada.');
    add('E', `Km 3–${num(km)}`, kmMin(km - 3), `${num(km - 3)} km`, `${eR} · RPE 2–3`, `Constante, sin acelerar al final. ${km >= 22 ? 'Para a las 3 h aunque falten kilómetros. ' : ''}Bebe cada 15–20′ y toma gel según tu plan.`);
    return st;
  }
  // Rodajes fáciles con progresivos (P)
  const pm = main.match(/con 4–6 progresivos de 20″/);
  if (pm) {
    const half = r5k(km / 2);
    E_('Primera mitad', half, 'Todo a ritmo E, sin pensar en el reloj.');
    add('H', '4–6 progresivos de 20″', 8, 'repartidos en la segunda mitad', 'acelera suave hasta RPE 5; no sprint', 'Cada 4–5′: 20″ de aceleración progresiva y vuelves a E con 1′ de trote. Son para soltar la zancada.');
    E_('Resto', km - half - (8 * 60 / mE), 'Vuelta a E. Si el tobillo molesta, quita los progresivos.');
    return st;
  }
  // Rodaje / tirada fácil
  E_('Todo el recorrido', km, 'Constante. Si no puedes hablar con frases completas, baja el ritmo. Mejor lento que rápido.');
  return st;
}
function stepsHTML(s, pc) {

function profileSVG(highlight) {
  const W = 720, H = 210, padL = 30, padR = 8, top = 12, base = 160, max = 60;
  const bw = (W - padL - padR) / 26, y = v => base - (v / max) * (base - top);
  let grid = '';
  [0, 20, 40, 60].forEach(v => grid += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`);
  let area = `M${padL},${base}`;
  WEEKS.forEach((wk, i) => { const x0 = padL + i * bw, v = Math.min(max, wk.estKm); area += ` L${x0},${y(v)} L${x0 + bw},${y(v)}`; });
  area += ` L${padL + 26 * bw},${base} Z`;
  let bars = '', labels = '', bands = '';
  WEEKS.forEach((wk, i) => {
    const x0 = padL + i * bw; const r = weekReal(wk).km;
    if (r > 0) bars += `<rect x="${x0 + bw * 0.28}" y="${y(Math.min(max, r))}" width="${bw * 0.44}" height="${base - y(Math.min(max, r))}" rx="1.5" fill="var(--ink)"/>`;
    if ((i + 1) % 4 === 1 || i === 25) labels += `<text x="${x0 + bw / 2}" y="${base + 14}" text-anchor="middle">S${i + 1}</text>`;
  });
  const ph = [['Adaptación',1,4],['Base',5,16],['Específica',17,23],['Reducción',24,26]];
  ph.forEach(([n, a, b]) => { const x0 = padL + (a - 1) * bw, x1 = padL + b * bw; bands += `<rect x="${x0 + 1}" y="${base + 22}" width="${x1 - x0 - 2}" height="6" rx="2" fill="${PHASE_C[n]}" opacity=".85"/><text x="${(x0 + x1) / 2}" y="${base + 42}" text-anchor="middle">${n}</text>`; });
  const hx = padL + (highlight - 1) * bw;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilómetros planificados y reales por semana">
    ${grid}<path d="${area}" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="${hx}" y="${top - 6}" width="${bw}" height="${base - top + 6}" fill="var(--accent)" fill-opacity=".10"/>
    ${bars}<line x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}" stroke="var(--muted)" stroke-width="1"/>${labels}${bands}
    <text x="${W - padR}" y="${top + 2}" text-anchor="end">km/semana</text>
  </svg>`;
}
function sparkSVG(pts, opts = {}) {
  if (pts.length < 2) return `<div class="empty">Aún no hay suficientes registros.</div>`;
  const W = 340, H = 90, pad = 8, padB = 18, vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => pad + i * (W - pad * 2) / (pts.length - 1), y = v => pad + (1 - (v - lo) / (hi - lo)) * (H - pad - padB);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || '')}">
    <line x1="${pad}" x2="${W - pad}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)"/><line x1="${pad}" x2="${W - pad}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)"/>
    <path d="${d} L${x(pts.length - 1)},${H - padB} L${x(0)},${H - padB} Z" fill="${opts.c || 'var(--accent)'}" fill-opacity=".12"/>
    <path d="${d}" fill="none" stroke="${opts.c || 'var(--accent)'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(last.v)}" r="3.5" fill="${opts.c || 'var(--accent)'}"/>
    <text x="${pad}" y="${H - 4}">${fDate(pts[0].d)}</text><text x="${W - pad}" y="${H - 4}" text-anchor="end">${fDate(last.d)}</text>
    <text x="${W - pad}" y="${y(hi) - 2 < 10 ? 10 : y(hi) - 2}" text-anchor="end">${opts.fmt ? opts.fmt(hi) : num(hi)}</text>
  </svg>`;
}

function readLog(s) {

  const r = document.querySelector('input[name="res"]:checked'); l.result = r ? r.value : 'success';
  if (s.kind === 'run') { setN('actualKm','f-km'); for (const [k, id] of [['actualMin','f-min'],['actualRunMin','f-run'],['actualWalkMin','f-walk']]) if (!setM(k, id)) { toast('Escribe el tiempo como mm:ss, por ejemplo 31:50.'); return null; } { const t = normTime(v('f-pace')); if (t == null) { toast('Escribe el ritmo como m:ss, por ejemplo 6:45 (también vale 6.45).'); return null; } if (t) l.avgPace = t; else delete l.avgPace; } setN('hr','f-hr'); if (s.type === 'R') { const t = normTime(v('f-race')); if (t == null) { toast('Escribe el tiempo oficial como mm:ss o h:mm:ss.'); return null; } if (t) l.raceTime = t; else delete l.raceTime; } }
  if (s.kind === 'gym') {

      const w = v('e' + i + 'w'), rp = v('e' + i + 'r'), ri = v('e' + i + 'i'), d = document.getElementById('e' + i + 'd').checked;
      const o = {done: d || !!rp}; const wn = parseNum(w), rn = parseNum(ri); if (isNaN(wn) || isNaN(rn)) bad = bad || 'e' + i + 'w'; if (wn != null && !isNaN(wn)) o.weight = wn; if (rp) o.reps = rp; if (rn != null && !isNaN(rn)) o.rir = rn;

  if (t.hasAttribute('data-move') || t.hasAttribute('data-unmove')) {
    const s = BYKEY[S.open]; const d = t.hasAttribute('data-unmove') ? s.date : $('#mv-date').value;
    if (!d) return;
    S.settings.moves = Object.assign({}, S.settings.moves); if (d === s.date) delete S.settings.moves[s.key]; else S.settings.moves[s.key] = d;
    await saveSettings(); renderSheet(); toast(d === s.date ? 'Sesión devuelta a su día' : `Sesión movida al ${fDay(d)}`); return;
  }
  if (t.id === 'exportBtn') {
    const data = JSON.stringify({version:'claude-1', exportedAt:new Date().toISOString(), settings:S.settings, logs:S.logs, body:S.body}, null, 1);
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
      a.download = `cuaderno-barcelona-2027-${TODAY}.json`; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Copia descargada');
    } catch (err) { const ta = $('#exportText'); ta.hidden = false; ta.value = data; ta.select(); toast('Selecciona el texto y cópialo'); }
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'authForm') {
    const email = $('#a-email').value.trim(), password = $('#a-pass').value, msg = $('#authMsg');
    const mode = e.submitter && e.submitter.dataset.mode === 'up' ? 'up' : 'in';
    if (!email || password.length < 6) { msg.textContent = 'Escribe tu email y una contraseña de al menos 6 caracteres.'; return; }
    msg.textContent = mode === 'up' ? 'Creando cuenta…' : 'Entrando…';
    const r = mode === 'up'
      ? await SB.auth.signUp({email, password, options: {emailRedirectTo: location.origin + location.pathname}})
      : await SB.auth.signInWithPassword({email, password});
    if (r.error) { msg.textContent = r.error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : r.error.message; return; }
    if (mode === 'up' && !r.data.session) msg.textContent = 'Cuenta creada. Abre el email de confirmación que te ha llegado y vuelve aquí para entrar.';
    return;
  }
  if (e.target.id === 'logForm') {
    const s = BYKEY[S.open], l = readLog(s); if (!l) return;
    S.logs[s.key] = l; closeSheet(); render();
    const prs = records().filter(r => r.key === s.key);
    if (await writeDoc('logs/' + s.key, l)) toast(prs.length ? `Sesión guardada · ¡Récord en ${prs.slice(0, 2).map(r => r.name + ' ' + num(r.w) + ' kg').join(' y ')}!` : 'Sesión guardada');
  }
  if (e.target.id === 'paceForm') {
    const tenN = normTime($('#p-10k').value), ten = tenN || '', ep = $('#p-e').value.trim();
    if (tenN == null || (ten && !tSec(ten))) return toast('El 10K va como mm:ss, por ejemplo 52:30.');
    if (ep && !/(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/.test(ep)) return toast('Escribe E como 6:50-7:20, o déjalo vacío.');
    S.settings.tenK = ten; S.settings.ePace = ep; await saveSettings(); toast('Ritmos guardados');
  }
  if (e.target.id === 'bodyForm') {
    const d = $('#b-date').value, val = id => parseNum($('#' + id).value);
    if (['b-weight','b-fat','b-muscle','b-water','b-visc','b-bone','b-bmr','b-waist'].some(id => isNaN(val(id)))) return toast('Revisa los números: usa coma o punto y hasta dos decimales, por ejemplo 17,85.');
    const w = val('b-weight'), c = val('b-waist');
    const comp = {fat: val('b-fat'), muscle: val('b-muscle'), water: val('b-water'), visceral: val('b-visc'), bone: val('b-bone'), bmr: val('b-bmr')};
    const hasComp = Object.values(comp).some(v => v != null);
    if (!d || (w == null && c == null && !hasComp)) return toast('Escribe al menos un dato: peso, cintura o composición.');
    if (w != null || c != null) { const o = Object.assign({}, S.body[d]); if (w != null) o.weight = w; if (c != null) o.waist = c; S.body[d] = o; }
    if (hasComp) { const cur = Object.assign({}, (S.settings.comp || {})[d]); Object.entries(comp).forEach(([k, v]) => { if (v != null) cur[k] = v; }); S.settings.comp = Object.assign({}, S.settings.comp, {[d]: cur}); }
    ['b-weight','b-fat','b-muscle','b-water','b-visc','b-bone','b-bmr','b-waist'].forEach(id => $('#' + id).value = ''); render();
    let ok = true;
    if (w != null || c != null) ok = await writeDoc('body/' + d, S.body[d]);
    if (ok && hasComp) ok = await writeDoc('meta/settings', clone(S.settings));
    if (ok) toast('Control guardado');
  }
  if (e.target.id === 'goalForm') {
    const f = parseNum($('#g-fat').value), w = parseNum($('#g-weight').value);
    if (isNaN(f) || isNaN(w)) return toast('Revisa los números: hasta dos decimales, por ejemplo 13,5.');
    S.settings.goal = {}; if (f != null) S.settings.goal.fat = f; if (w != null) S.settings.goal.weight = w;
    await saveSettings(); toast('Objetivo guardado');
  }
});
document.addEventListener('change', async e => {
  if (e.target.dataset && e.target.dataset.sumMode) { S.sum.mode = e.target.dataset.sumMode; return render(); }
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const msg = $('#importMsg');
  try {
    const d = JSON.parse(await e.target.files[0].text());
    const logs = d.logs || {}, keys = Object.keys(logs).filter(k => /^\d{4}-\d{2}-\d{2}-\d+$/.test(k));
    if (!keys.length) { msg.textContent = 'El archivo no contiene registros de sesiones.'; return; }
    let n = 0;
    for (const k of keys) { const v = clone(logs[k]); delete v.targetAtSave; S.logs[k] = v; if (await writeDoc('logs/' + k, v)) n++; msg.textContent = `Importando… ${n}/${keys.length}`; }
    if (d.settings) { if (d.settings.tenKTime && !S.settings.tenK) S.settings.tenK = d.settings.tenKTime; if (d.settings.moves) S.settings.moves = Object.assign({}, S.settings.moves, d.settings.moves); if (d.settings.ePace) S.settings.ePace = d.settings.ePace; if (d.settings.comp) S.settings.comp = Object.assign({}, S.settings.comp, d.settings.comp); if (d.settings.goal && !S.settings.goal) S.settings.goal = d.settings.goal; await saveSettings(); }
    if (d.body) for (const [k, v] of Object.entries(d.body)) { S.body[k] = v; await writeDoc('body/' + k, v); }
    msg.textContent = `${n} sesiones importadas.`; render();
  } catch (err) { msg.textContent = 'No se ha podido leer el archivo. Comprueba que es la copia en JSON.'; }
  e.target.value = '';
});
document.addEventListener('focusout', e => { const el = e.target; if (!el.classList || !el.classList.contains('tm') || !el.value.trim()) return; const t = normTime(el.value); if (t) el.value = t; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) closeSheet(); });
document.addEventListener('input', e => { const m = e.target.id && e.target.id.match(/^e(\d+)r$/); if (m && e.target.value) { const c = document.getElementById('e' + m[1] + 'd'); if (c) c.checked = true; } });

render();
initStore();
</script>
</body>
